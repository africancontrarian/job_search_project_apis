# Alternative to nginx: HAProxy config for lb01 (only use ONE of the two).
# Append to /etc/haproxy/haproxy.cfg, then: sudo systemctl restart haproxy

frontend jobs_front
    bind *:80
    mode http
    timeout client 90s
    default_backend jobs_back

backend jobs_back
    mode http
    balance roundrobin
    timeout connect 5s
    timeout server 90s
    option httpchk GET /api/health
    http-check expect status 200
    http-response set-header X-Upstream %s
    server web01 13.40.149.114:8000 check
    server web02 18.175.45.200:8000 check
