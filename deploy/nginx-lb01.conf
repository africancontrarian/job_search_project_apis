# Nginx load balancer config for lb01.
# Copy to /etc/nginx/sites-available/jobs and symlink into sites-enabled.
# Replace the two IPs with your real web01 and web02 addresses.

upstream jobs_backend {
    # Shared memory zone so every nginx worker uses ONE round robin counter.
    # Without it, each worker alternates on its own and the split looks uneven.
    zone jobs_backend 64k;

    # Round robin is the default: requests alternate web01, web02, web01...
    # max_fails and fail_timeout take a dead server out of rotation for 30s.
    server 13.40.149.114:8000 max_fails=3 fail_timeout=30s;   # web01
    server 18.175.45.200:8000 max_fails=3 fail_timeout=30s;   # web02
    keepalive 16;
}

server {
    listen 80;
    server_name 13.40.99.74 _;   # add your .tech domain here once you have it

    # CV uploads can be up to 5MB. Nginx defaults to 1MB, which would
    # reject most PDF uploads with a 413 before they reach the app.
    client_max_body_size 6m;

    # Shows which backend answered, so you can verify balancing with curl.
    add_header X-Upstream $upstream_addr always;

    location / {
        proxy_pass http://jobs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI calls can take a while. Give them room before nginx gives up.
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # If one server is down or refuses the connection, retry on the other.
        proxy_next_upstream error timeout http_502 http_503;
    }
}
